title = "Gitleaks configuration with allowlist for test fixtures"

[allowlist]
description = "Allowlist for test fixtures, mocks, and CI dummy keys"
paths = [
    '''(^|/)tests\.py$''',
    '''(^|/)test_.*\.py$''',
    '''tests/.*''',
    '''\.github/workflows/.*''',
]
regexes = [
    '''dGxWdXJzYXllbGVud3dpcHJlc3M=''',
    '''ZEd4V2RYSnpZWGxsYkdWdWQzZHBjSEpsYzNNPT0=''',
    '''chave-de-teste-ci-segura-nao-usar-em-producao-django''',
    '''global-secret-key-999''',
    '''senhaSegura123''',
    '''senhaForte123''',
]
